[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "papertrade"
version = "0.1.0"
description = "Automated intraday paper-trading system for Nifty and Sensex index options (option buying only, no live orders)."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "tzdata>=2024.1",
    "pyarrow>=15",
    "numpy>=1.26",
    "scipy>=1.11",
    "anthropic>=2.3",
    "httpx>=0.27",
    "feedparser>=6.0",
    "apscheduler>=3.10,<4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
live = ["kotakneoapi==3.0.13", "pyotp>=2.9", "boto3>=1.34"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "py_vollib>=1.0", "kotakneoapi==3.0.13", "pyotp>=2.9", "boto3>=1.34"]

[tool.setuptools.packages.find]
include = ["engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["db: needs a running Postgres (DATABASE_URL)"]
