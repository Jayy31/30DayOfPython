# LLM tasks, models and pricing. Provider/model IDs come from env (LLM_PROVIDER,
# LLM_MODEL_FAST, LLM_MODEL_SMART); the monthly budget from LLM_MONTHLY_BUDGET_USD.
# The LLM interprets news and writes text. It never overrides the risk engine.

max_prompt_tokens: 90000        # stay under the 100K Haiku price step
tasks:
  news_scoring:      {tier: fast,  max_tokens: 4000,  effort: low}
  live_summary:      {tier: fast,  max_tokens: 2000,  effort: low}
  premarket_report:  {tier: smart, max_tokens: 16000, effort: medium}
  trade_review:      {tier: smart, max_tokens: 8000,  effort: medium}
  postmarket_review: {tier: smart, max_tokens: 16000, effort: medium}
  weekly_review:     {tier: smart, max_tokens: 16000, effort: medium}
  monthly_review:    {tier: smart, max_tokens: 16000, effort: medium}

# USD per million tokens. VERIFY cache prices against the current pricing page.
pricing:
  claude-haiku-5-5:
    input: 0.10
    output: 0.50
    cache_read: 0.01
    cache_write: 0.125
    long_context_threshold: 100000
    long_context_multiplier: 5
  claude-sonnet-5-5:
    input: 2.00
    output: 10.00
    cache_read: 0.20
    cache_write: 2.50
